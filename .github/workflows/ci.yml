name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.14 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate evaluation corpora
        run: |
          python3 scripts/run_skill_evals.py
          python3 scripts/run_forward_evals.py --check-cases
      - name: Validate candidate publication boundaries
        run: python3 -m unittest discover -s .github/tests -v
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Execute deterministic forward contracts
        run: python3 scripts/run_forward_evals.py --run
      - name: Validate source and release closure
        run: python3 scripts/validate_longtask.py
