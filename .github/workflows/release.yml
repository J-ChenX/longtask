name: Candidate release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Detect unpublished version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Detect missing candidate
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_candidate.py plan

  checks:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish candidate
    needs: [plan, checks]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify tag and build complete plugin
        id: package
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          version = json.loads(Path("release-manifest.json").read_text())["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) or tag != f"v{version}":
              sys.exit("Release tag must exactly match the plugin version in release-manifest.json")
          sections = re.findall(r"^## ([^\n]+)(?:\n|\Z)(.*?)(?=^## |\Z)",
                                Path("版本说明.md").read_text(encoding="utf-8"), flags=re.MULTILINE | re.DOTALL)
          changes = [body.strip() for heading, body in sections if heading.strip() == version]
          if len(changes) != 1 or not changes[0]:
              sys.exit("版本说明.md must contain exactly one nonempty section headed '## ' plus the release version")
          builder = Path("scripts/build_release.py").resolve()
          archive = Path("dist") / f"longtask-{version}.zip"
          subprocess.run([sys.executable, str(builder), "build", "--root", ".", "--output", str(archive)], check=True)
          subprocess.run([sys.executable, str(builder), "verify", "--root", ".", "--archive", str(archive)], check=True)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as temporary:
              rebuilt = Path(temporary) / archive.name
              subprocess.run([sys.executable, str(builder), "build", "--root", ".", "--output", str(rebuilt)], check=True)
              if hashlib.sha256(rebuilt.read_bytes()).hexdigest() != digest:
                  sys.exit("Repeated release builds differ")
              destination = Path(temporary) / "installed"
              subprocess.run([sys.executable, str(builder), "extract", "--archive", str(archive),
                              "--destination", str(destination), "--expected-sha256", digest], check=True)
              installed = destination / "longtask"
              subprocess.run([sys.executable, str(installed / "scripts/validate_longtask.py"), "--installed"],
                             cwd=installed, check=True)
          Path(f"dist/longtask-{version}.sha256").write_text(f"{digest}  {archive.name}\n")
          notes = (
              f"# longtask {version} candidate\n\n"
              f"{changes[0]}\n\n"
              "## 工件与发布验证\n\n"
              f"Source commit: {os.environ['GITHUB_SHA']}\n"
              f"Archive SHA-256: {digest}\n\n"
              "源码校验、调用语料合同、单元测试、确定性前向合同、双构建与提取后自检已通过。\n\n"
              "此候选预发布尚未通过真实 Codex 宿主发布门及当前版本恢复验收；"
              "它不证明真实模型行为或性能收益。正式发布资格须另行通过 "
              "scripts/validate_longtask.py --require-release-pass。\n\n"
              "安装步骤与兼容性请参阅当前版本的 README 和 references/发布与恢复.md。\n"
          )
          Path("dist/release-notes.txt").write_text(notes, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Publish candidate with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python3 .github/scripts/publish_candidate.py publish
