name: 改进建议
description: 用具体使用场景说明你希望改善的结果。
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与问题
      description: 描述实际任务、当前做法及具体限制。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与验收
      description: 什么可观察的结果能证明改进有效？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案与影响
      description: 可补充替代方案、兼容要求或涉及的合同。
